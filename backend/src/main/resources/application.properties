spring.application.name=flogin

# ===============================
# DATABASE CONFIGURATION (H2)
# ===============================
spring.datasource.url=jdbc:h2:mem:floginDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let JPA automatically create tables based on entities
spring.datasource.initialization-mode=always
spring.jpa.hibernate.ddl-auto=create-drop

# Show SQL queries in console (useful for debugging)
spring.jpa.show-sql=true

# Pretty-print SQL
spring.jpa.properties.hibernate.format_sql=true

# Enable the H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# SERVER CONFIGURATION
# ===============================
server.address=0.0.0.0
server.port=8080

